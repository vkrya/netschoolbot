# nginx для netschool.ikrya.ru → PWA «Сетевого города» и панель (порт 8283)
#
# $connection_upgrade объявляется общим map'ом в другом конфиге сервера
# (sites-available/webterm), поэтому здесь его дублировать нельзя.

server {
    listen 80;
    listen [::]:80;
    server_name netschool.ikrya.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netschool.ikrya.ru;

    ssl_certificate     /etc/letsencrypt/live/netschool.ikrya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netschool.ikrya.ru/privkey.pem;

    client_max_body_size 64m;

    # Корень домена — это мини-приложение, а не панель
    location = / {
        return 302 /mini/netschool;
    }

    # Панель управления: снаружи /panel/, внутри приложение живёт в корне
    location /panel/ {
        proxy_pass http://127.0.0.1:8283/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /panel;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /panel {
        return 302 /panel/;
    }

    # PWA и её API: /mini/netschool, /api/mini/..., /static_web/, /socket.io/
    location / {
        proxy_pass http://127.0.0.1:8283;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
