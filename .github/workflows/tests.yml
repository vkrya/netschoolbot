name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Проверка, что приложение собирается
        # Ловит сломанные импорты и опечатки в сборке зависимостей — то,
        # что тесты на отдельных модулях могут не заметить.
        run: python -c "import app.main, app.web.server, app.bot.app"
