name: Развёртывание на VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Execute remote SSH deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            export HOME=/root
            git config --global --add safe.directory /opt/netschoolbot
            cd /opt/netschoolbot
            git fetch origin main
            git reset --hard origin/main
            /opt/netschoolbot/venv/bin/pip install -q -r requirements.txt

            # Юнит systemd на сервере — копия файла из репозитория, и сам
            # по себе он не обновляется. Без этой синхронизации изменение
            # команды запуска в репозитории не доезжает до сервера, и
            # служба перезапускается со старой, уже несуществующей.
            install -m 644 deploy/systemd/netschoolbot.service \
              /etc/systemd/system/netschoolbot.service
            systemctl daemon-reload

            systemctl restart netschoolbot

            # Перезапуск возвращает управление сразу: проверяем, что служба
            # действительно поднялась, иначе деплой отчитается об успехе
            # при упавшем боте.
            sleep 5
            systemctl is-active --quiet netschoolbot || {
              echo "Служба не поднялась:"
              journalctl -u netschoolbot -n 40 --no-pager
              exit 1
            }
            echo "🚀 [GitHub Actions CI/CD] NetSchool bot deployed and restarted!"

      - name: 🤖 AI Verdict & Telegram Notification
        if: always()
        env:
          AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.AI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_TG_USER_ID: ${{ secrets.MY_TG_USER_ID }}
          JOB_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c "
          import os, requests

          status = os.getenv('JOB_STATUS')
          repo = os.getenv('REPO_NAME')
          full_commit = os.getenv('COMMIT_MSG', '').strip()
          commit_title = full_commit.split('\n')[0][:90] if full_commit else 'без коммита'

          ai_key = os.getenv('AI_API_KEY')
          bot_token = os.getenv('BOT_TOKEN')
          my_id = os.getenv('MY_TG_USER_ID')

          if not bot_token or not my_id:
              print('Telegram credentials missing, skipping notification.')
              exit(0)

          if status == 'success':
              msg = f'✅ <b>[Деплой Успешен]</b>\n📌 <code>{repo}</code>\n📝 <i>{commit_title}</i>\n🚀 Развернуто и запущенно!'
          else:
              prompt = f'Деплой {repo} упал (коммит: {commit_title}). Сформулируй вердикт ОЧЕНЬ КРАТКО (1-2 предложения на русском).'
              ai_text = 'Ошибка SSH подключения. Проверьте секреты VPS_HOST в GitHub Secrets.'
              if ai_key:
                  try:
                      res = requests.post(
                          'https://openrouter.ai/api/v1/chat/completions',
                          headers={'Authorization': f'Bearer {ai_key}'},
                          json={'model': 'openrouter/free', 'messages': [{'role': 'user', 'content': prompt}], 'max_tokens': 120},
                          timeout=15
                      ).json()
                      ai_text = res['choices'][0]['message']['content'].strip()
                  except Exception as e:
                      print(f'AI error: {e}')

              msg = f'❌ <b>[Деплой Упал!]</b>\n📌 <code>{repo}</code>\n📝 <i>{commit_title}</i>\n\n🤖 <b>Вердикт:</b> {ai_text}'

          requests.post(f'https://api.telegram.org/bot{bot_token}/sendMessage', json={'chat_id': my_id, 'text': msg, 'parse_mode': 'HTML'})
          "
