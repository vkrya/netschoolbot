<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4a76a8">
<title>{{ school or "Дневник" }}</title>
<link rel="manifest" href="{{ base }}/manifest.webmanifest?token={{ token }}">
<link rel="icon" href="{{ base }}/static/icon.svg">
<link rel="apple-touch-icon" href="{{ base }}/static/icon.svg">
<link rel="stylesheet" href="{{ base }}/static/app.css?v={{ version }}">
<!-- До app.js: приложению нужен Telegram.WebApp уже при старте, чтобы
     забрать initData и цвета темы до первой отрисовки. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header class="topbar">
  <button class="topbar-btn" id="childBtn" hidden aria-label="Сменить ученика">👤</button>
  <div class="topbar-title" id="topTitle">Дневник</div>
  <button class="topbar-btn" id="refreshBtn" aria-label="Обновить">⟳</button>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section class="panel active" id="panel-diary">
    <div class="week-nav">
      <button id="weekPrev" aria-label="Предыдущая неделя">◀</button>
      <button class="week-label" id="weekLabel"></button>
      <button id="weekNext" aria-label="Следующая неделя">▶</button>
    </div>
    <div class="day-strip" id="dayStrip"></div>
    <div id="diaryContent"></div>
  </section>

  <section class="panel" id="panel-grades"><div id="gradesContent"></div></section>
  <section class="panel" id="panel-homework"><div id="homeworkContent"></div></section>
  <section class="panel" id="panel-mail"><div id="mailContent"></div></section>
  <section class="panel" id="panel-calc"><div id="calcContent"></div></section>
  <section class="panel" id="panel-profile"><div id="profileContent"></div></section>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-tab="diary"><span class="ico">📒</span><span>Дневник</span></button>
  <button class="nav-item" data-tab="grades"><span class="badge" id="badgeGrades" hidden></span><span class="ico">📊</span><span>Оценки</span></button>
  <button class="nav-item" data-tab="homework"><span class="badge" id="badgeHomework" hidden></span><span class="ico">📝</span><span>ДЗ</span></button>
  <button class="nav-item" data-tab="mail"><span class="badge" id="badgeMail" hidden></span><span class="ico">✉️</span><span>Почта</span></button>
  <button class="nav-item" data-tab="calc"><span class="ico">🧮</span><span>Баллы</span></button>
  <button class="nav-item" data-tab="profile"><span class="ico">⚙️</span><span>Ещё</span></button>
</nav>

<div class="overlay" id="sheet" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="sheet-close" id="sheetClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
  window.NETSCHOOL = {
    base: {{ base | tojson }},
    token: {{ token | tojson }},
    pushEnabled: {{ push_enabled | tojson }},
    student: {{ student | tojson }},
    school: {{ school | tojson }}
  };
</script>
<script src="{{ base }}/static/js/app.js?v={{ version }}" type="module"></script>
</body>
</html>
